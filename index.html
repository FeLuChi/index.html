<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Budget Manager</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#f7f6f3;--surface:#fff;--surface2:#f0efe9;--border:#e2e0d8;--border2:#cac8bf;
  --text:#1a1917;--text2:#6b6960;--text3:#9e9c95;
  --green:#1a7a52;--green-bg:#e8f5ee;--green-mid:#a8dcc1;
  --red:#c0392b;--red-bg:#fdecea;
  --amber:#92600a;--amber-bg:#fef3e2;--amber-mid:#f0c97a;
  --accent:#2d5be3;--accent-bg:#eef1fd;--accent-mid:#b5ccf8;
  --blue-mid:#7ba8f0;
  --radius:10px;--radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:10}
.logo{font-size:16px;font-weight:600;letter-spacing:-.02em}.logo span{color:var(--accent)}
.month-nav{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500}
.month-nav button{background:none;border:none;cursor:pointer;color:var(--text2);font-size:18px;line-height:1;padding:4px}
.month-nav button:hover{color:var(--text)}
.main{max-width:920px;margin:0 auto;padding:2rem 1.5rem}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.card-metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem}
.card-metric .label{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.card-metric .value{font-size:26px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:-.02em}
.card-metric .value.green{color:var(--green)}.card-metric .value.red{color:var(--red)}
.assign-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1.25rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.75rem}
.assign-bar .label{font-size:13px;color:var(--text2)}
.assign-bar .value{font-family:'DM Mono',monospace;font-size:17px;font-weight:500}
.assign-bar .value.ok{color:var(--green)}.assign-bar .value.warn{color:var(--red)}
.tabs{display:flex;gap:4px;margin-bottom:1.5rem;flex-wrap:wrap}
.tab{padding:7px 18px;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;border:1px solid var(--border);border-radius:999px;cursor:pointer;background:transparent;color:var(--text2);transition:all .15s}
.tab:hover{color:var(--text);border-color:var(--border2)}.tab.active{background:var(--text);color:#fff;border-color:var(--text)}
.section-head{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.75rem;margin-top:1.5rem}
.section-head:first-child{margin-top:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.25rem}
.row{display:flex;align-items:center;gap:10px;padding:.7rem 1.1rem;border-bottom:1px solid var(--border);font-size:14px}
.row:last-child{border-bottom:none}.row .name{flex:1}
.row .amount{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--green)}
.col-head{display:flex;align-items:center;gap:10px;padding:.5rem 1.1rem;background:var(--surface2);font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
.col-head .n{flex:1}.col-head .b,.col-head .s,.col-head .l{width:80px;text-align:right}.col-head .p{width:100px;text-align:right}
.cat-row{display:flex;align-items:center;gap:10px;padding:.65rem 1.1rem;border-bottom:1px solid var(--border);font-size:14px}
.cat-row:last-child{border-bottom:none}.cat-row .cn{flex:1}
.cat-row .cs{width:80px;text-align:right;font-family:'DM Mono',monospace;font-size:13px;color:var(--text2)}
.cat-row .cl{width:80px;text-align:right;font-family:'DM Mono',monospace;font-size:13px;font-weight:500}
.cl.ok{color:var(--green)}.cl.warn{color:var(--amber)}.cl.over{color:var(--red)}
.bar-wrap{width:100px;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .3s}
.bar-fill.ok{background:var(--green)}.bar-fill.warn{background:#f59e0b}.bar-fill.over{background:var(--red)}
.add-row{display:flex;align-items:center;gap:8px;padding:.7rem 1.1rem;background:var(--surface2);flex-wrap:wrap}
input[type=text],input[type=number],select{padding:6px 10px;font-size:13px;font-family:'DM Sans',sans-serif;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none}
input[type=text]:focus,input[type=number]:focus,select:focus{border-color:var(--accent)}
input[type=number]{width:100px;text-align:right;font-family:'DM Mono',monospace}
.cat-budget-input{width:80px;text-align:right;font-family:'DM Mono',monospace;padding:4px 8px;font-size:13px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);outline:none}
.cat-budget-input:focus{border-color:var(--accent)}
input[type=text]{flex:1;min-width:100px}
.btn{padding:6px 14px;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:hover{background:var(--text);color:#fff;border-color:var(--text)}
.del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1;padding:0 2px;font-family:'DM Sans',sans-serif}
.del:hover{color:var(--red)}
.tx-row{display:flex;align-items:center;gap:10px;padding:.65rem 1.1rem;border-bottom:1px solid var(--border);font-size:14px}
.tx-row:last-child{border-bottom:none}
.tx-date{width:60px;font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}.tx-desc{flex:1}
.tx-cat{width:130px;font-size:12px}
.tx-cat span{background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 7px;color:var(--text2)}
.tx-amt{width:90px;text-align:right;font-family:'DM Mono',monospace;font-size:13px;font-weight:500}
.tx-amt.pos{color:var(--green)}.tx-amt.neg{color:var(--red)}
.empty{padding:2rem;text-align:center;color:var(--text3);font-size:13px}

/* INSIGHTS */
.invest-card{background:var(--green-bg);border:1px solid var(--green-mid);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.invest-card .il .i-label{font-size:11px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.invest-card .il .i-value{font-size:34px;font-weight:600;font-family:'DM Mono',monospace;color:var(--green);letter-spacing:-.02em}
.invest-card .il .i-sub{font-size:12px;color:#2d7a53;margin-top:4px}
.invest-card .ir{text-align:right}
.invest-card .ir .pct{font-size:42px;font-weight:600;font-family:'DM Mono',monospace;color:var(--green);letter-spacing:-.02em}
.invest-card .ir .pct-label{font-size:11px;color:#2d7a53}
.insight-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:1.5rem}
.insight-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem}
.insight-card .i-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.insight-card .i-value{font-size:26px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:-.02em;margin-bottom:4px}
.insight-card .i-sub{font-size:12px;color:var(--text2)}

/* health score */
.score-ring-wrap{display:flex;align-items:center;gap:1.5rem;padding:1.25rem 1.5rem}
.score-ring{position:relative;width:90px;height:90px;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-ring .score-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;font-family:'DM Mono',monospace}
.score-details{flex:1}
.score-details .score-label{font-size:16px;font-weight:600;margin-bottom:6px}
.score-details .score-sub{font-size:13px;color:var(--text2);line-height:1.6}
.score-criteria{display:flex;flex-direction:column;gap:6px;padding:.75rem 1.1rem;border-top:1px solid var(--border)}
.sc-item{display:flex;align-items:center;gap:8px;font-size:13px}
.sc-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sc-dot.ok{background:var(--green)}.sc-dot.warn{background:#f59e0b}.sc-dot.bad{background:var(--red)}
.sc-name{flex:1;color:var(--text2)}.sc-pts{font-family:'DM Mono',monospace;font-size:12px;font-weight:500}

/* trend chart */
.trend-chart{padding:1.25rem 1.1rem}
.trend-svg-wrap{width:100%;overflow-x:auto}
.trend-legend{display:flex;gap:16px;margin-top:10px;padding-left:4px}
.tl-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.tl-dot{width:10px;height:3px;border-radius:2px}

/* bar chart rows */
.chart-bar-row{display:flex;align-items:center;gap:10px;padding:.55rem 1.1rem;border-bottom:1px solid var(--border);font-size:13px}
.chart-bar-row:last-child{border-bottom:none}
.chart-bar-row .cb-name{width:140px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-bar-row .cb-bar-wrap{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.chart-bar-row .cb-bar{height:100%;border-radius:4px;background:var(--accent)}
.chart-bar-row .cb-amt{width:70px;text-align:right;font-family:'DM Mono',monospace;font-weight:500;color:var(--text2)}
.chart-bar-row .cb-pct{width:40px;text-align:right;font-size:11px;color:var(--text3)}

/* simulator */
.sim-wrap{padding:1.25rem 1.5rem}
.sim-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sim-row label{font-size:13px;color:var(--text2);width:160px;flex-shrink:0}
.sim-row input[type=range]{flex:1}
.sim-row .sim-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;width:70px;text-align:right}
.sim-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
.sim-card{background:var(--accent-bg);border:1px solid var(--accent-mid);border-radius:var(--radius-sm);padding:.85rem 1rem;text-align:center}
.sim-card .sy{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.sim-card .sv{font-size:20px;font-weight:600;font-family:'DM Mono',monospace;color:var(--accent)}
.sim-card .sp{font-size:11px;color:var(--text2);margin-top:3px}

/* what-if */
.whatif-wrap{padding:1.25rem 1.5rem}
.whatif-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.whatif-row label{font-size:13px;color:var(--text2);flex:1}
.whatif-row input[type=range]{width:120px}
.whatif-row .wv{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;width:40px;text-align:right;color:var(--red)}
.whatif-result{background:var(--green-bg);border:1px solid var(--green-mid);border-radius:var(--radius-sm);padding:.9rem 1rem;display:flex;align-items:center;justify-content:space-between}
.whatif-result .wr-label{font-size:13px;color:#2d7a53}
.whatif-result .wr-value{font-family:'DM Mono',monospace;font-size:18px;font-weight:600;color:var(--green)}

/* alerts */
.alert-row{display:flex;align-items:flex-start;gap:10px;padding:.85rem 1.1rem;border-bottom:1px solid var(--border);font-size:13px}
.alert-row:last-child{border-bottom:none}
.alert-icon{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;margin-top:1px}
.alert-icon.warn{background:var(--amber-bg);color:var(--amber)}
.alert-icon.ok{background:var(--green-bg);color:var(--green)}
.alert-icon.info{background:var(--accent-bg);color:var(--accent)}
.alert-text{flex:1;line-height:1.5;color:var(--text)}
.alert-text strong{font-weight:500}

/* tips */
.tip-box{background:var(--amber-bg);border:1px solid var(--amber-mid);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1rem}
.tip-box .tip-title{font-size:12px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.tip-box .tip-text{font-size:13px;color:#5a3c08;line-height:1.6}

.no-data-msg{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px}

@media(max-width:600px){
  .summary{grid-template-columns:1fr 1fr}
  .summary .card-metric:last-child{grid-column:span 2}
  .insight-grid{grid-template-columns:1fr}
  .sim-results{grid-template-columns:1fr}
  .invest-card{flex-direction:column;align-items:flex-start}
  header{padding:0 1rem}.main{padding:1rem}
  .sim-row{flex-wrap:wrap}.sim-row label{width:100%}
}
</style>
</head>
<body>
<header>
  <div class="logo">budget<span>.</span></div>
  <div class="month-nav">
    <button onclick="changeMonth(-1)">&#8249;</button>
    <span id="month-label">April 2026</span>
    <button onclick="changeMonth(1)">&#8250;</button>
  </div>
</header>

<div class="main">
  <div class="summary">
    <div class="card-metric"><div class="label">Income</div><div class="value green" id="s-income">$0</div></div>
    <div class="card-metric"><div class="label">Budgeted</div><div class="value" id="s-budgeted">$0</div></div>
    <div class="card-metric"><div class="label">Spent</div><div class="value red" id="s-spent">$0</div></div>
  </div>
  <div class="assign-bar">
    <div class="label">Ready to assign</div>
    <div class="value ok" id="s-assign">$0</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('budget')">Budget</button>
    <button class="tab" onclick="showTab('transactions')">Transactions</button>
    <button class="tab" onclick="showTab('insights')">Insights</button>
  </div>

  <!-- BUDGET -->
  <div id="tab-budget">
    <div class="section-head">Income</div>
    <div class="card">
      <div id="income-list"></div>
      <div class="add-row">
        <input type="text" id="inc-name" placeholder="Income source (e.g. Salary)" />
        <input type="number" id="inc-amt" placeholder="0" />
        <button class="btn" onclick="addIncome()">+ Add income</button>
      </div>
    </div>
    <div class="section-head">Spending categories</div>
    <div class="card">
      <div class="col-head"><span class="n">Category</span><span class="b">Budget</span><span class="s">Spent</span><span class="l">Left</span><span class="p">Progress</span></div>
      <div id="cat-list"></div>
      <div class="add-row">
        <input type="text" id="cat-name" placeholder="Category name" />
        <input type="number" id="cat-bud" placeholder="Budget" />
        <button class="btn" onclick="addCategory()">+ Add category</button>
      </div>
    </div>
  </div>

  <!-- TRANSACTIONS -->
  <div id="tab-transactions" style="display:none">
    <div class="card" style="margin-bottom:1.25rem">
      <div class="add-row">
        <input type="text" id="tx-desc" placeholder="Description" />
        <select id="tx-cat-sel"></select>
        <input type="number" id="tx-amt" placeholder="Amount" style="width:100px" />
        <select id="tx-type"><option value="expense">Expense</option><option value="income">Income</option></select>
        <button class="btn" onclick="addTransaction()">+ Add</button>
      </div>
    </div>
    <div class="card">
      <div class="col-head" style="display:flex;gap:10px;padding:.5rem 1.1rem">
        <span style="width:60px">Date</span><span style="flex:1">Description</span>
        <span style="width:130px">Category</span><span style="width:90px;text-align:right">Amount</span><span style="width:20px"></span>
      </div>
      <div id="tx-list"></div>
    </div>
  </div>

  <!-- INSIGHTS -->
  <div id="tab-insights" style="display:none">
    <div id="insights-content"></div>
  </div>
</div>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let currentMonth=3, currentYear=2026;
function monthKey(){return currentYear+'-'+currentMonth}

function loadData(){
  const saved=localStorage.getItem('budget_'+monthKey());
  if(saved) return JSON.parse(saved);
  if(monthKey()==='2026-3') return {
    income:[{id:1,name:'Salary',amount:3500},{id:2,name:'Freelance',amount:500}],
    categories:[
      {id:1,name:'Housing',budget:1200},{id:2,name:'Food & groceries',budget:400},
      {id:3,name:'Transport',budget:200},{id:4,name:'Entertainment',budget:150},
      {id:5,name:'Savings',budget:600},{id:6,name:'Health',budget:100}
    ],
    transactions:[
      {id:1,desc:'Rent',cat:1,amount:1200,type:'expense',date:'Apr 01'},
      {id:2,desc:'Supermarket',cat:2,amount:85,type:'expense',date:'Apr 03'},
      {id:3,desc:'Bus pass',cat:3,amount:60,type:'expense',date:'Apr 04'},
      {id:4,desc:'Gym',cat:6,amount:45,type:'expense',date:'Apr 05'},
      {id:5,desc:'Netflix',cat:4,amount:15,type:'expense',date:'Apr 06'},
      {id:6,desc:'Supermarket',cat:2,amount:70,type:'expense',date:'Apr 08'}
    ],
    nextId:20
  };
  return {income:[],categories:[],transactions:[],nextId:1};
}
function saveData(){localStorage.setItem('budget_'+monthKey(),JSON.stringify(state))}
let state=loadData();
function fmt(n){return '$'+Math.abs(Math.round(n)).toLocaleString()}
function fmtSigned(n){return(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString()}
function spentByCat(id){return state.transactions.filter(t=>t.cat===id&&t.type==='expense').reduce((s,t)=>s+t.amount,0)}

// collect all months that have saved data
function getAllMonthsData(){
  const keys=Object.keys(localStorage).filter(k=>k.startsWith('budget_'));
  return keys.map(k=>{
    const d=JSON.parse(localStorage.getItem(k));
    const parts=k.replace('budget_','').split('-');
    return {year:+parts[0],month:+parts[1],data:d};
  }).sort((a,b)=>a.year!==b.year?a.year-b.year:a.month-b.month);
}

function renderIncome(){
  const el=document.getElementById('income-list');
  if(!state.income.length){el.innerHTML='<div class="empty">No income added yet</div>';return}
  el.innerHTML=state.income.map(i=>`<div class="row"><span class="name">${i.name}</span><span class="amount">${fmt(i.amount)}</span><button class="del" onclick="delIncome(${i.id})">×</button></div>`).join('');
}
function renderCategories(){
  const el=document.getElementById('cat-list');
  if(!state.categories.length){el.innerHTML='<div class="empty">No categories yet</div>';return}
  el.innerHTML=state.categories.map(c=>{
    const spent=spentByCat(c.id),left=c.budget-spent;
    const pct=c.budget>0?Math.min(100,Math.round(spent/c.budget*100)):0;
    const cls=pct>=100?'over':pct>=80?'warn':'ok';
    const lc=left<0?'over':left<c.budget*.2?'warn':'ok';
    return `<div class="cat-row"><span class="cn">${c.name}</span><input class="cat-budget-input" type="number" value="${c.budget}" onchange="updateBudget(${c.id},this.value)"/><span class="cs">${fmt(spent)}</span><span class="cl ${lc}">${fmtSigned(left)}</span><div class="bar-wrap"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div><button class="del" onclick="delCategory(${c.id})">×</button></div>`;
  }).join('');
  const sel=document.getElementById('tx-cat-sel');
  if(sel) sel.innerHTML=state.categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
}
function renderTransactions(){
  const el=document.getElementById('tx-list');if(!el)return;
  if(!state.transactions.length){el.innerHTML='<div class="empty">No transactions yet</div>';return}
  el.innerHTML=[...state.transactions].reverse().map(t=>{
    const cat=state.categories.find(c=>c.id===t.cat);
    return `<div class="tx-row"><span class="tx-date">${t.date}</span><span class="tx-desc">${t.desc}</span><span class="tx-cat"><span>${cat?cat.name:'—'}</span></span><span class="tx-amt ${t.type==='income'?'pos':'neg'}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</span><button class="del" onclick="delTransaction(${t.id})">×</button></div>`;
  }).join('');
}

function renderInsights(){
  const el=document.getElementById('insights-content');
  const totalIncome=state.income.reduce((s,i)=>s+i.amount,0);
  const totalSpent=state.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const avail=totalIncome-totalSpent;
  const savingsRate=totalIncome>0?Math.round(avail/totalIncome*100):0;
  const overBudgetCats=state.categories.filter(c=>spentByCat(c.id)>c.budget);
  const txCount=state.transactions.filter(t=>t.type==='expense').length;
  const biggestExpense=[...state.categories].sort((a,b)=>spentByCat(b.id)-spentByCat(a.id))[0];
  const catSpendData=state.categories.map(c=>({name:c.name,spent:spentByCat(c.id),budget:c.budget})).filter(c=>c.spent>0).sort((a,b)=>b.spent-a.spent);
  const maxSpent=catSpendData.length>0?catSpendData[0].spent:1;
  const allMonths=getAllMonthsData();

  if(totalIncome===0){el.innerHTML='<div class="no-data-msg">Add your income and transactions to see insights.</div>';return}

  // ── HEALTH SCORE ──
  let score=0, criteria=[];
  const sr=savingsRate;
  if(sr>=20){score+=30;criteria.push({label:'Savings rate ≥ 20%',pts:30,cls:'ok'})}
  else if(sr>=10){score+=15;criteria.push({label:`Savings rate ${sr}% (target: 20%)`,pts:15,cls:'warn'})}
  else{criteria.push({label:`Savings rate ${sr}% (target: 20%)`,pts:0,cls:'bad'})}
  if(overBudgetCats.length===0){score+=25;criteria.push({label:'All categories within budget',pts:25,cls:'ok'})}
  else if(overBudgetCats.length===1){score+=10;criteria.push({label:`1 category over budget`,pts:10,cls:'warn'})}
  else{criteria.push({label:`${overBudgetCats.length} categories over budget`,pts:0,cls:'bad'})}
  if(state.income.length>=2){score+=20;criteria.push({label:'Multiple income sources',pts:20,cls:'ok'})}
  else{score+=10;criteria.push({label:'Single income source (diversify for more points)',pts:10,cls:'warn'})}
  if(txCount>=5){score+=15;criteria.push({label:'Active expense tracking',pts:15,cls:'ok'})}
  else{score+=5;criteria.push({label:'Track more transactions for accuracy',pts:5,cls:'warn'})}
  if(totalIncome>0&&avail>0){score+=10;criteria.push({label:'Positive monthly balance',pts:10,cls:'ok'})}
  else if(avail<=0){criteria.push({label:'Spending exceeds income',pts:0,cls:'bad'})}
  score=Math.min(100,score);
  const scoreColor=score>=75?'#1a7a52':score>=50?'#92600a':'#c0392b';
  const scoreLabel=score>=75?'Excellent':score>=50?'Good':score>=30?'Fair':'Needs work';
  const circ=2*Math.PI*38, dashArr=Math.round(circ*score/100)+' '+Math.round(circ);

  // ── TREND CHART (SVG) ──
  let trendHTML='<div class="empty" style="padding:1.5rem">Add data for multiple months to see the trend.</div>';
  if(allMonths.length>=1){
    const W=560,H=160,PAD={t:16,r:16,b:32,l:56};
    const cw=W-PAD.l-PAD.r, ch=H-PAD.t-PAD.b;
    const points=allMonths.map(m=>{
      const inc=m.data.income.reduce((s,i)=>s+i.amount,0);
      const spent=m.data.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
      return {label:MONTHS[m.month].slice(0,3)+' '+m.year,income:inc,spent,surplus:inc-spent};
    });
    const allVals=points.flatMap(p=>[p.income,p.spent,0]);
    const maxV=Math.max(...allVals)*1.1||1000;
    const x=(i)=>PAD.l+i*(cw/(Math.max(points.length-1,1)));
    const y=(v)=>PAD.t+ch-(v/maxV*ch);
    const line=(key,col)=>points.map((p,i)=>`${i===0?'M':'L'}${Math.round(x(i))},${Math.round(y(p[key]))}`).join(' ');
    const dots=(key,col)=>points.map((p,i)=>`<circle cx="${Math.round(x(i))}" cy="${Math.round(y(p[key]))}" r="4" fill="${col}" stroke="#fff" stroke-width="2"/>`).join('');
    const labels=points.map((p,i)=>`<text x="${Math.round(x(i))}" y="${H-6}" text-anchor="middle" font-size="11" fill="#9e9c95" font-family="DM Sans,sans-serif">${p.label}</text>`).join('');
    const gridLines=[0,.25,.5,.75,1].map(f=>{
      const yv=Math.round(y(maxV*f));
      const val=Math.round(maxV*f);
      return `<line x1="${PAD.l}" y1="${yv}" x2="${W-PAD.r}" y2="${yv}" stroke="#e2e0d8" stroke-width="0.5"/><text x="${PAD.l-6}" y="${yv+4}" text-anchor="end" font-size="10" fill="#9e9c95" font-family="DM Mono,monospace">$${val>=1000?Math.round(val/100)/10+'k':val}</text>`;
    }).join('');
    trendHTML=`<div class="trend-svg-wrap"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">
      ${gridLines}
      <path d="${line('income','#1a7a52')}" fill="none" stroke="#1a7a52" stroke-width="2" stroke-linejoin="round"/>
      <path d="${line('spent','#c0392b')}" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/>
      <path d="${line('surplus','#2d5be3')}" fill="none" stroke="#2d5be3" stroke-width="1.5" stroke-dasharray="5,3" stroke-linejoin="round"/>
      ${dots('income','#1a7a52')}${dots('spent','#c0392b')}${dots('surplus','#2d5be3')}
      ${labels}
    </svg></div>
    <div class="trend-legend">
      <div class="tl-item"><div class="tl-dot" style="background:#1a7a52"></div>Income</div>
      <div class="tl-item"><div class="tl-dot" style="background:#c0392b"></div>Spending</div>
      <div class="tl-item"><div class="tl-dot" style="background:#2d5be3;"></div>Surplus</div>
    </div>`;
  }

  // ── SMART ALERTS ──
  const alerts=[];
  if(overBudgetCats.length>0) alerts.push({cls:'warn',icon:'!',text:`<strong>${overBudgetCats.map(c=>c.name).join(', ')}</strong> went over budget this month.`});
  if(allMonths.length>=2){
    const prev=allMonths[allMonths.length-2].data;
    const prevSpent=prev.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    const diff=Math.round(totalSpent-prevSpent);
    if(diff>0) alerts.push({cls:'warn',icon:'↑',text:`Spending is <strong>${fmt(diff)} higher</strong> than last month.`});
    else if(diff<0) alerts.push({cls:'ok',icon:'↓',text:`Great — spending is <strong>${fmt(Math.abs(diff))} lower</strong> than last month.`});
    const prevIncome=prev.income.reduce((s,i)=>s+i.amount,0);
    const incDiff=Math.round(totalIncome-prevIncome);
    if(incDiff>0) alerts.push({cls:'ok',icon:'↑',text:`Income increased by <strong>${fmt(incDiff)}</strong> compared to last month.`});
  }
  if(savingsRate>=20) alerts.push({cls:'ok',icon:'★',text:`Your savings rate of <strong>${savingsRate}%</strong> is above the recommended 20%. You're on track.`});
  else if(savingsRate<10&&totalIncome>0) alerts.push({cls:'warn',icon:'!',text:`Your savings rate is only <strong>${savingsRate}%</strong>. Aim for at least 20% to build long-term wealth.`});
  if(avail>0) alerts.push({cls:'info',icon:'i',text:`You have <strong>${fmt(avail)}</strong> available to invest or save this month.`});

  // ── RECOMMENDATIONS ──
  const tips=[];
  if(overBudgetCats.length>0) tips.push(`You overspent in <strong>${overBudgetCats.map(c=>c.name).join(', ')}</strong>. Review those categories and consider adjusting your budget or cutting back next month.`);
  if(savingsRate>=20&&avail>0){
    const y5=Math.round(avail*((Math.pow(1+(0.08/12),60)-1)/(0.08/12)));
    const y10=Math.round(avail*((Math.pow(1+(0.08/12),120)-1)/(0.08/12)));
    tips.push(`Investing your monthly surplus of <strong>${fmt(avail)}</strong> at 8% annually could grow to <strong>${fmt(y5)}</strong> in 5 years and <strong>${fmt(y10)}</strong> in 10 years.`);
  }
  if(state.income.length<2) tips.push(`You currently have a single income source. Adding a second stream (freelance, dividends, rental) significantly improves your financial resilience.`);

  el.innerHTML=`
  <div class="invest-card">
    <div class="il">
      <div class="i-label">Available to invest</div>
      <div class="i-value">${fmtSigned(avail)}</div>
      <div class="i-sub">Income minus actual spending this month</div>
    </div>
    <div class="ir">
      <div class="pct">${savingsRate}%</div>
      <div class="pct-label">savings rate</div>
    </div>
  </div>

  <div class="insight-grid">
    <div class="insight-card"><div class="i-label">Total income</div><div class="i-value" style="color:var(--green)">${fmt(totalIncome)}</div><div class="i-sub">${state.income.length} source${state.income.length!==1?'s':''}</div></div>
    <div class="insight-card"><div class="i-label">Total spent</div><div class="i-value" style="color:var(--red)">${fmt(totalSpent)}</div><div class="i-sub">${txCount} transaction${txCount!==1?'s':''}</div></div>
    <div class="insight-card"><div class="i-label">Biggest expense</div><div class="i-value" style="font-size:18px;margin-top:4px">${biggestExpense?biggestExpense.name:'—'}</div><div class="i-sub">${biggestExpense?fmt(spentByCat(biggestExpense.id))+' spent':'No transactions'}</div></div>
    <div class="insight-card"><div class="i-label">Over-budget</div><div class="i-value" style="color:${overBudgetCats.length>0?'var(--red)':'var(--green)'}">${overBudgetCats.length}</div><div class="i-sub">${overBudgetCats.length===0?'All within budget':overBudgetCats.map(c=>c.name).join(', ')}</div></div>
  </div>

  <div class="section-head">Financial health score</div>
  <div class="card" style="margin-bottom:1.25rem">
    <div class="score-ring-wrap">
      <div class="score-ring">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="38" fill="none" stroke="#e2e0d8" stroke-width="7"/>
          <circle cx="45" cy="45" r="38" fill="none" stroke="${scoreColor}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${dashArr}" style="transition:stroke-dasharray .6s"/>
        </svg>
        <div class="score-num" style="color:${scoreColor}">${score}</div>
      </div>
      <div class="score-details">
        <div class="score-label" style="color:${scoreColor}">${scoreLabel}</div>
        <div class="score-sub">Based on your savings rate, budget discipline, income diversity, and tracking habits.</div>
      </div>
    </div>
    <div class="score-criteria">
      ${criteria.map(c=>`<div class="sc-item"><div class="sc-dot ${c.cls}"></div><span class="sc-name">${c.label}</span><span class="sc-pts" style="color:${c.cls==='ok'?'var(--green)':c.cls==='warn'?'var(--amber)':'var(--red)'}">${c.pts>0?'+'+c.pts+' pts':'0 pts'}</span></div>`).join('')}
    </div>
  </div>

  <div class="section-head">Income vs. spending trend</div>
  <div class="card" style="margin-bottom:1.25rem">
    <div class="trend-chart">${trendHTML}</div>
  </div>

  <div class="section-head">Spending by category</div>
  <div class="card" style="margin-bottom:1.25rem">
    ${catSpendData.length===0?'<div class="empty">No spending recorded yet</div>':
      catSpendData.map(c=>{
        const pct=Math.round(c.spent/totalSpent*100);
        return `<div class="chart-bar-row"><span class="cb-name">${c.name}</span><div class="cb-bar-wrap"><div class="cb-bar" style="width:${Math.round(c.spent/maxSpent*100)}%"></div></div><span class="cb-amt">${fmt(c.spent)}</span><span class="cb-pct">${pct}%</span></div>`;
      }).join('')
    }
  </div>

  <div class="section-head">Investment simulator</div>
  <div class="card" style="margin-bottom:1.25rem">
    <div class="sim-wrap">
      <div class="sim-row">
        <label>Monthly contribution</label>
        <input type="range" min="50" max="5000" step="50" value="${Math.max(50,Math.round(avail/50)*50)}" id="sim-contrib" oninput="updateSim()"/>
        <span class="sim-val" id="sim-contrib-val">${fmt(Math.max(50,Math.round(avail/50)*50))}</span>
      </div>
      <div class="sim-row">
        <label>Annual return rate</label>
        <input type="range" min="1" max="20" step="0.5" value="8" id="sim-rate" oninput="updateSim()"/>
        <span class="sim-val" id="sim-rate-val">8%</span>
      </div>
      <div class="sim-results" id="sim-results"></div>
    </div>
  </div>

  <div class="section-head">What-if scenarios</div>
  <div class="card" style="margin-bottom:1.25rem">
    <div class="whatif-wrap">
      ${catSpendData.slice(0,3).map((c,i)=>`
        <div class="whatif-row">
          <label>Cut <strong>${c.name}</strong> spending by</label>
          <input type="range" min="0" max="100" step="5" value="20" id="wi-${i}" oninput="updateWhatIf()"/>
          <span class="wv" id="wi-val-${i}">20%</span>
        </div>`).join('')}
      <div class="whatif-result">
        <span class="wr-label">Extra money available to invest per month</span>
        <span class="wr-value" id="wi-result">${fmt(0)}</span>
      </div>
    </div>
  </div>

  ${alerts.length>0?`<div class="section-head">Smart alerts</div><div class="card" style="margin-bottom:1.25rem">${alerts.map(a=>`<div class="alert-row"><div class="alert-icon ${a.cls}">${a.icon}</div><div class="alert-text">${a.text}</div></div>`).join('')}</div>`:''}

  ${tips.length>0?`<div class="section-head">Recommendations</div>${tips.map(t=>`<div class="tip-box"><div class="tip-title">Insight</div><div class="tip-text">${t}</div></div>`).join('')}`:''}
  `;

  updateSim();
  updateWhatIf();

  // store catSpendData for what-if
  window._catSpendData=catSpendData;
  window._baseAvail=avail;
}

function updateSim(){
  const contrib=parseFloat(document.getElementById('sim-contrib').value)||0;
  const rate=parseFloat(document.getElementById('sim-rate').value)||8;
  document.getElementById('sim-contrib-val').textContent=fmt(contrib);
  document.getElementById('sim-rate-val').textContent=rate.toFixed(1)+'%';
  const r=rate/100/12;
  const calc=(n)=>Math.round(contrib*((Math.pow(1+r,n)-1)/r));
  const r5=calc(60),r10=calc(120),r20=calc(240);
  const contributed5=contrib*60,contributed10=contrib*120,contributed20=contrib*240;
  document.getElementById('sim-results').innerHTML=`
    <div class="sim-card"><div class="sy">5 years</div><div class="sv">${fmt(r5)}</div><div class="sp">+${fmt(r5-contributed5)} returns</div></div>
    <div class="sim-card"><div class="sy">10 years</div><div class="sv">${fmt(r10)}</div><div class="sp">+${fmt(r10-contributed10)} returns</div></div>
    <div class="sim-card"><div class="sy">20 years</div><div class="sv">${fmt(r20)}</div><div class="sp">+${fmt(r20-contributed20)} returns</div></div>`;
}

function updateWhatIf(){
  const cats=window._catSpendData||[];
  let extra=0;
  cats.slice(0,3).forEach((c,i)=>{
    const el=document.getElementById('wi-'+i);
    const vEl=document.getElementById('wi-val-'+i);
    if(!el) return;
    const pct=parseFloat(el.value)||0;
    if(vEl) vEl.textContent=pct+'%';
    extra+=c.spent*(pct/100);
  });
  const res=document.getElementById('wi-result');
  if(res) res.textContent=fmt(Math.round(extra));
}

function renderSummary(){
  const ti=state.income.reduce((s,i)=>s+i.amount,0);
  const tb=state.categories.reduce((s,c)=>s+c.budget,0);
  const ts=state.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const asgn=ti-tb;
  document.getElementById('s-income').textContent=fmt(ti);
  document.getElementById('s-budgeted').textContent=fmt(tb);
  document.getElementById('s-spent').textContent=fmt(ts);
  const el=document.getElementById('s-assign');
  el.textContent=fmtSigned(asgn);
  el.className='value '+(asgn>=0?'ok':'warn');
}
function renderMonth(){document.getElementById('month-label').textContent=MONTHS[currentMonth]+' '+currentYear}
function render(){renderIncome();renderCategories();renderTransactions();renderSummary();renderMonth()}

function addIncome(){
  const n=document.getElementById('inc-name').value.trim();
  const a=parseFloat(document.getElementById('inc-amt').value);
  if(!n||isNaN(a)||a<=0)return;
  state.income.push({id:state.nextId++,name:n,amount:a});
  document.getElementById('inc-name').value='';document.getElementById('inc-amt').value='';
  saveData();render();
}
function delIncome(id){state.income=state.income.filter(i=>i.id!==id);saveData();render()}
function addCategory(){
  const n=document.getElementById('cat-name').value.trim();
  const b=parseFloat(document.getElementById('cat-bud').value);
  if(!n||isNaN(b)||b<0)return;
  state.categories.push({id:state.nextId++,name:n,budget:b});
  document.getElementById('cat-name').value='';document.getElementById('cat-bud').value='';
  saveData();render();
}
function delCategory(id){state.categories=state.categories.filter(c=>c.id!==id);saveData();render()}
function updateBudget(id,val){
  const c=state.categories.find(c=>c.id===id);if(c)c.budget=parseFloat(val)||0;
  saveData();renderSummary();renderCategories();
}
function addTransaction(){
  const desc=document.getElementById('tx-desc').value.trim();
  const cat=parseInt(document.getElementById('tx-cat-sel').value);
  const amt=parseFloat(document.getElementById('tx-amt').value);
  const type=document.getElementById('tx-type').value;
  if(!desc||isNaN(amt)||amt<=0)return;
  const now=new Date();
  const date=MONTHS[currentMonth].slice(0,3)+' '+String(now.getDate()).padStart(2,'0');
  state.transactions.push({id:state.nextId++,desc,cat,amount:amt,type,date});
  document.getElementById('tx-desc').value='';document.getElementById('tx-amt').value='';
  saveData();render();
}
function delTransaction(id){state.transactions=state.transactions.filter(t=>t.id!==id);saveData();render()}
function showTab(tab){
  ['budget','transactions','insights'].forEach(t=>{document.getElementById('tab-'+t).style.display=t===tab?'block':'none'});
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.textContent.toLowerCase().includes(tab)));
  if(tab==='transactions')renderTransactions();
  if(tab==='insights')renderInsights();
}
function changeMonth(dir){
  currentMonth+=dir;
  if(currentMonth>11){currentMonth=0;currentYear++}
  if(currentMonth<0){currentMonth=11;currentYear--}
  state=loadData();render();
}
render();
</script>
</body>
</html>
